name: PWA Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore verified chess engine
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/crownforge.part* | base64 --decode > crownforge-checkpoint.zip
          echo "1bc617418feb0da5860fbb789265df2e496b3e95fea0474af0fcf3896dbbf770  crownforge-checkpoint.zip" | sha256sum --check
          unzip -q crownforge-checkpoint.zip
          cp CrownforgeChess_WebCheckpoint1/dist/src/engine.js src/engine-stable.js

      - name: Check browser JavaScript syntax
        run: |
          node --check service-worker.js
          node --check src/app-stable.js
          node --check src/board3d.js
          node --check src/board3d-meshes.js
          node --check src/engine-stable.js
          node --check src/feedback.js
          node --check src/premium-soundtrack.js
          node --check src/cinematic-director.js
          node --check .github/scripts/verify-living-crown.mjs

      - name: Verify offline app-shell integrity
        run: node .github/scripts/verify-pwa-integrity.mjs

      - name: Verify production 3D renderer contracts
        run: node .github/scripts/verify-3d-renderer.mjs

      - name: Verify adaptive Living Crown audio contracts
        run: node .github/scripts/verify-living-crown.mjs
