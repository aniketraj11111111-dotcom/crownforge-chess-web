name: Crownforge verification and live game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crownforge-pages
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Engine, rules and fixed-board tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify fixed board orientation
        shell: bash
        run: |
          node --check src/app.js
          node --check src/feedback.js
          grep -q 'dataset.orientation = "white"' src/app.js
          if grep -Eq 'id="rotate"|id="auto-rotate"|Flip Board|whiteBottom|autoRotateInput|rotateBtn' index.html src/app.js; then
            echo "Board rotation code or controls were detected."
            exit 1
          fi
      - name: Restore verified checkpoint
        shell: bash
        run: |
          cat .payload/crownforge.part* | base64 --decode > crownforge-checkpoint.zip
          echo "1bc617418feb0da5860fbb789265df2e496b3e95fea0474af0fcf3896dbbf770  crownforge-checkpoint.zip" | sha256sum --check
          unzip -q crownforge-checkpoint.zip
      - name: Run compiled rules suite
        run: node CrownforgeChess_WebCheckpoint1/dist/tests/run-tests.js

  canonical-perft:
    name: Perft ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Initial
            fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
            expected: 197281
          - name: Kiwipete
            fen: "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"
            expected: 4085603
          - name: Endgame
            fen: "8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1"
            expected: 43238
          - name: Promotion-Castling
            fen: "r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1"
            expected: 422333
          - name: Tactical-Promotion
            fen: "rnbq1k1r/pp1Pbppp/2p5/8/2B5/8/PPP1NnPP/RNBQK2R w KQ - 1 8"
            expected: 2103487
          - name: Tactical-Midgame
            fen: "r4rk1/1pp1qppp/p1np1n2/2b1p1B1/2B1P1b1/P1NP1N2/1PP1QPPP/R4RK1 w - - 0 10"
            expected: 3894594
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified checkpoint
        shell: bash
        run: |
          cat .payload/crownforge.part* | base64 --decode > crownforge-checkpoint.zip
          echo "1bc617418feb0da5860fbb789265df2e496b3e95fea0474af0fcf3896dbbf770  crownforge-checkpoint.zip" | sha256sum --check
          unzip -q crownforge-checkpoint.zip
      - name: Verify depth-4 leaf count
        env:
          FEN: ${{ matrix.fen }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          node --input-type=module <<'NODE'
          import { parseFen, perft } from './CrownforgeChess_WebCheckpoint1/dist/src/engine.js';
          const actual = perft(parseFen(process.env.FEN), 4);
          const expected = Number(process.env.EXPECTED);
          console.log(JSON.stringify({ actual, expected }));
          if (actual !== expected) process.exit(1);
          NODE

  deploy:
    name: Publish current live game
    needs: [fast-tests, canonical-perft]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare current playable PWA
        shell: bash
        run: |
          rm -rf site
          mkdir -p site
          cp index.html styles.css last-move.css manifest.webmanifest service-worker.js site/
          cp -R src assets public site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload current playable PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
