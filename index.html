<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0908">
  <title>Crownforge Chess</title>
  <link rel="manifest" href="./manifest.webmanifest?v=27">
  <link rel="stylesheet" href="./styles.css?v=27">
  <link rel="stylesheet" href="./last-move.css?v=27">
  <link rel="stylesheet" href="./turn-guidance.css?v=27">
  <link rel="stylesheet" href="./premium-phase1.css?v=27">
  <link rel="stylesheet" href="./webgl-phase2.css?v=27">
  <link rel="stylesheet" href="./cinematic-endgame.css?v=27">
  <link rel="stylesheet" href="./board-geometry-lock.css?v=27">
  <link rel="stylesheet" href="./touch-feedback.css?v=27">
  <link rel="stylesheet" href="./offline-status.css?v=27">
  <link rel="stylesheet" href="./install-control.css?v=27">
  <link rel="stylesheet" href="./fullscreen-control.css?v=27">
  <style>
    /*
     * Tablet stability gate.
     * Touch devices use the verified DOM board as the sole visual/input layer.
     * This prevents a WebGL canvas and the immutable grid from drifting apart
     * during browser chrome changes, fullscreen transitions or touch scrolling.
     */
    html.touch-stable #board-3d {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    html.touch-stable .board .piece,
    html.touch-stable.webgl-3d-ready .board .piece,
    html.touch-stable .webgl-3d-ready .board .piece {
      opacity: 1 !important;
      visibility: visible !important;
    }

    html.touch-stable .board .square.light {
      background:
        linear-gradient(145deg, rgba(255,255,255,.16), transparent 34%),
        repeating-linear-gradient(8deg, rgba(111,73,39,.035) 0 1px, transparent 1px 6px),
        linear-gradient(145deg, #ead49f, #c9a76c 72%, #b88d57) !important;
    }

    html.touch-stable .board .square.dark {
      background:
        linear-gradient(145deg, rgba(255,255,255,.07), transparent 34%),
        repeating-linear-gradient(8deg, rgba(255,221,160,.025) 0 1px, transparent 1px 6px),
        linear-gradient(145deg, #75472e, #4a281a 70%, #321a12) !important;
    }

    html.touch-stable,
    html.touch-stable body,
    html.touch-stable .app-shell,
    html.touch-stable .game-layout,
    html.touch-stable .board-stage,
    html.touch-stable .board {
      overscroll-behavior: none !important;
    }

    html.touch-stable .board-stage,
    html.touch-stable .board,
    html.touch-stable .square {
      touch-action: none !important;
      transform: none !important;
      transition: none !important;
      animation: none !important;
    }

    html.touch-stable .board-stage {
      position: relative !important;
      width: 100% !important;
      min-width: 0 !important;
      align-self: start !important;
      overflow: hidden !important;
    }

    @media (pointer: coarse) and (orientation: landscape) {
      .app-shell {
        width: 100% !important;
        max-width: none !important;
        padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)) !important;
      }

      .game-layout {
        grid-template-columns: minmax(0, min(70vw, calc(100dvh - 28px))) minmax(230px, 1fr) !important;
        gap: 16px !important;
        align-items: start !important;
      }

      .board-stage {
        width: min(70vw, calc(100dvh - 28px)) !important;
        max-width: 100% !important;
        padding: 10px !important;
      }

      aside {
        min-width: 0 !important;
      }
    }

    @media (pointer: coarse) and (orientation: portrait) {
      .game-layout {
        grid-template-columns: minmax(0, 1fr) !important;
      }

      .board-stage {
        width: 100% !important;
        max-width: 100% !important;
      }
    }
  </style>
  <script>
    (() => {
      const coarsePointer = window.matchMedia?.("(pointer: coarse)")?.matches;
      const touchDevice = coarsePointer || (navigator.maxTouchPoints || 0) > 0;
      if (!touchDevice) return;

      document.documentElement.classList.add("touch-stable", "webgl-3d-unavailable");
      document.documentElement.classList.remove("webgl-3d-ready");
      window.CROWNFORGE_DISABLE_WEBGL = true;

      const preserveFallback = () => {
        document.documentElement.classList.add("touch-stable", "webgl-3d-unavailable");
        document.documentElement.classList.remove("webgl-3d-ready");
        const canvas = document.querySelector("#board-3d");
        if (canvas) {
          canvas.dataset.ready = "false";
          canvas.dataset.aligned = "false";
          canvas.dataset.fallbackReason = "touch-stability-gate";
        }
      };

      window.addEventListener("pageshow", preserveFallback, { passive: true });
      window.addEventListener("orientationchange", preserveFallback, { passive: true });
      document.addEventListener("fullscreenchange", preserveFallback, { passive: true });
      new MutationObserver(preserveFallback).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class"],
      });
    })();
  </script>
</head>
<body>
  <main class="app-shell">
    <header>
      <div><p class="eyebrow">CROWNFORGE</p><h1>Play in Person</h1></div>
      <div class="crest">♔</div>
    </header>
    <section class="status-card">
      <strong id="status">Loading verified chessboard…</strong>
      <span id="substatus"></span>
    </section>
    <div class="pwa-status-row">
      <span id="connection-status" class="connection-status" role="status" aria-live="polite" data-connection="preparing">Preparing offline play</span>
      <button id="fullscreen-app" class="fullscreen-app" type="button" aria-pressed="false" hidden>Fullscreen</button>
      <button id="install-app" class="install-app" type="button" hidden>Install App</button>
    </div>
    <section class="game-layout">
      <div class="board-stage">
        <canvas id="board-3d" data-ready="false" data-aligned="false" aria-hidden="true"></canvas>
        <div id="board" class="board" aria-label="Fixed square 8 by 8 chessboard with White at the bottom"></div>
      </div>
      <aside>
        <div class="controls">
          <button id="restart">New Game</button>
          <button id="claim-draw" disabled>Claim Draw</button>
        </div>
        <div class="history-panel">
          <h2>Move history</h2>
          <ol id="history"></ol>
        </div>
      </aside>
    </section>
  </main>

  <dialog id="promotion-dialog">
    <h2>Choose promotion</h2>
    <div class="promotion-grid">
      <button data-promotion="5">♕<span>Queen</span></button>
      <button data-promotion="4">♖<span>Rook</span></button>
      <button data-promotion="3">♗<span>Bishop</span></button>
      <button data-promotion="2">♘<span>Knight</span></button>
    </div>
  </dialog>

  <div id="victory" class="victory">
    <div class="victory-beam"></div>
    <div class="victory-card">
      <p>FINAL POSITION CONFIRMED</p>
      <h2 id="victory-title">CHECKMATE</h2>
      <strong id="victory-text">WHITE WINS</strong>
      <button id="rematch">Rematch</button>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js?v=27").catch(() => {});
      });
    }

    window.addEventListener("error", () => {
      const board = document.querySelector("#board");
      const status = document.querySelector("#status");
      if (board && status && board.children.length === 0) {
        status.textContent = "Game update loading — refresh once";
      }
    });

    window.setTimeout(() => {
      const board = document.querySelector("#board");
      const status = document.querySelector("#status");
      if (board && status && board.children.length !== 64) {
        status.textContent = "Game update loading — refresh once";
      }
    }, 5000);
  </script>
  <script src="./src/feedback.js?v=27" defer></script>
  <script src="./src/terminal-focus.js?v=27" defer></script>
  <script src="./src/keyboard-nav.js?v=27" defer></script>
  <script src="./src/promotion-focus.js?v=27" defer></script>
  <script src="./src/board-semantics.js?v=27" defer></script>
  <script src="./src/touch-feedback.js?v=27" defer></script>
  <script src="./src/screen-wake.js?v=27" defer></script>
  <script src="./src/connectivity-status.js?v=27" defer></script>
  <script src="./src/fullscreen-control.js?v=27" defer></script>
  <script src="./src/install-control.js?v=27" defer></script>
  <script src="./src/cinematic-director.js?v=27" defer></script>
  <script type="module" src="./src/board3d.js?v=27"></script>
  <script type="module" src="./src/app-stable.js?v=27"></script>
</body>
</html>
