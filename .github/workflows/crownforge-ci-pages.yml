name: Crownforge verified cinematic release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crownforge-pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    name: Verify stable game and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore verified chess engine
        shell: bash
        run: |
          set -euo pipefail
          test -d .payload
          cat .payload/crownforge.part* | base64 --decode > crownforge-checkpoint.zip
          echo "1bc617418feb0da5860fbb789265df2e496b3e95fea0474af0fcf3896dbbf770  crownforge-checkpoint.zip" | sha256sum --check
          unzip -q crownforge-checkpoint.zip
          test -f CrownforgeChess_WebCheckpoint1/dist/src/engine.js
          test -f CrownforgeChess_WebCheckpoint1/dist/tests/run-tests.js

      - name: Verify source syntax and chess rules
        shell: bash
        run: |
          set -euo pipefail
          for file in src/*.js service-worker.js; do
            node --check "$file"
          done
          node CrownforgeChess_WebCheckpoint1/dist/tests/run-tests.js
          node --input-type=module <<'NODE'
          import { ChessGame, Side } from './CrownforgeChess_WebCheckpoint1/dist/src/engine.js';
          const game = new ChessGame();
          if (game.position.sideToMove !== Side.White) throw new Error('Initial side-to-move must be White');
          if (game.getLegalMoves().length !== 20) throw new Error('Initial legal-move count must be 20');
          console.log('Stable engine smoke gate passed.');
          NODE

      - name: Build self-contained playable PWA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/src
          cp index.html manifest.webmanifest service-worker.js site/
          cp ./*.css site/
          cp -R public site/
          cp -R src/. site/src/
          cp CrownforgeChess_WebCheckpoint1/dist/src/engine.js site/src/engine-stable.js

          test -f site/index.html
          test -f site/src/app-stable.js
          test -f site/src/engine-stable.js
          test -f site/src/board3d.js
          test -f site/src/board3d-meshes.js
          test -f site/service-worker.js

          for file in site/src/*.js site/service-worker.js; do
            node --check "$file"
          done

          node --input-type=module <<'NODE'
          import { ChessGame, Side } from './site/src/engine-stable.js';
          const game = new ChessGame();
          if (game.position.sideToMove !== Side.White) throw new Error('Deployed side-to-move gate failed');
          if (game.getLegalMoves().length !== 20) throw new Error('Deployed legal-move gate failed');
          console.log('Deploy package smoke gate passed.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified game
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy verified game
        id: deployment
        uses: actions/deploy-pages@v4
