name: Crownforge verification and live game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crownforge-pages
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Engine, rules, immutable-board and WebGL isolation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify fixed board and isolated offline WebGL presentation
        shell: bash
        run: |
          node --check src/app-stable.js
          node --check src/feedback.js
          node --check src/board3d.js
          node --check src/board3d-meshes.js
          node --check service-worker.js

          grep -q 'dataset.orientation = "white"' src/app-stable.js
          grep -q 'function lockBoardGeometry' src/app-stable.js
          grep -q 'cellViews.size === 64' src/app-stable.js
          grep -q 'dataset.geometryLocked = "true"' src/app-stable.js
          grep -q 'grid-template-columns: repeat(8' board-geometry-lock.css
          grep -q 'grid-template-rows: repeat(8' board-geometry-lock.css
          grep -q '<canvas id="board-3d"' index.html
          grep -q 'premium-phase1.css?v=11' index.html
          grep -q 'webgl-phase2.css?v=11' index.html
          grep -q 'board-geometry-lock.css?v=11' index.html
          grep -q 'src/board3d.js?v=11' index.html
          grep -q 'src/app-stable.js?v=11' index.html
          grep -q "from'./board3d-meshes.js'" src/board3d.js
          grep -q "getContext('webgl2'" src/board3d.js
          grep -q 'pointer-events: none' webgl-phase2.css
          grep -q 'webgl-3d-unavailable' webgl-phase2.css

          premium_line=$(grep -n 'premium-phase1.css?v=11' index.html | head -1 | cut -d: -f1)
          webgl_line=$(grep -n 'webgl-phase2.css?v=11' index.html | head -1 | cut -d: -f1)
          geometry_line=$(grep -n 'board-geometry-lock.css?v=11' index.html | head -1 | cut -d: -f1)
          if [ "$premium_line" -ge "$webgl_line" ] || [ "$webgl_line" -ge "$geometry_line" ]; then
            echo "Unsafe premium/WebGL/geometry stylesheet order."
            exit 1
          fi

          if grep -Eq 'grid-template|aspect-ratio|--locked-board-size|--locked-cell-size' premium-phase1.css webgl-phase2.css; then
            echo "Presentation layer attempted to control board geometry."
            exit 1
          fi

          if grep -Eq 'ChessGame|game\.play|engine-stable|applyLegalMove|generateLegalMoves' src/board3d.js src/board3d-meshes.js; then
            echo "WebGL presentation attempted to access or mutate chess state."
            exit 1
          fi

          if grep -Eq 'id="rotate"|id="auto-rotate"|Flip Board|whiteBottom|autoRotateInput|rotateBtn' index.html src/app-stable.js; then
            echo "Board rotation code or controls were detected."
            exit 1
          fi

          if grep -Eq 'classList\.(add|remove)\("(move-impact|illegal)"' src/app-stable.js; then
            echo "Whole-board animation trigger was detected."
            exit 1
          fi

          if [ "$(grep -c 'boardEl.replaceChildren' src/app-stable.js)" -ne 1 ]; then
            echo "Board DOM must be created once and reused after initial render."
            exit 1
          fi

      - name: Restore verified checkpoint
        shell: bash
        run: |
          cat .payload/crownforge.part* | base64 --decode > crownforge-checkpoint.zip
          echo "1bc617418feb0da5860fbb789265df2e496b3e95fea0474af0fcf3896dbbf770  crownforge-checkpoint.zip" | sha256sum --check
          unzip -q crownforge-checkpoint.zip

      - name: Run compiled rules suite
        run: node CrownforgeChess_WebCheckpoint1/dist/tests/run-tests.js

  canonical-perft:
    name: Perft ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Initial
            fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
            expected: 197281
          - name: Kiwipete
            fen: "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"
            expected: 4085603
          - name: Endgame
            fen: "8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1"
            expected: 43238
          - name: Promotion-Castling
            fen: "r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1"
            expected: 422333
          - name: Tactical-Promotion
            fen: "rnbq1k1r/pp1Pbppp/2p5/8/2B5/8/PPP1NnPP/RNBQK2R w KQ - 1 8"
            expected: 2103487
          - name: Tactical-Midgame
            fen: "r4rk1/1pp1qppp/p1np1n2/2b1p1B1/2B1P1b1/P1NP1N2/1PP1QPPP/R4RK1 w - - 0 10"
            expected: 3894594
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified checkpoint
        shell: bash
        run: |
          cat .payload/crownforge.part* | base64 --decode > crownforge-checkpoint.zip
          echo "1bc617418feb0da5860fbb789265df2e496b3e95fea0474af0fcf3896dbbf770  crownforge-checkpoint.zip" | sha256sum --check
          unzip -q crownforge-checkpoint.zip

      - name: Verify depth-4 leaf count
        env:
          FEN: ${{ matrix.fen }}
          EXPECTED: ${{ matrix.expected }}
        run: |
          node --input-type=module <<'NODE'
          import { parseFen, perft } from './CrownforgeChess_WebCheckpoint1/dist/src/engine.js';
          const actual = perft(parseFen(process.env.FEN), 4);
          const expected = Number(process.env.EXPECTED);
          console.log(JSON.stringify({ actual, expected }));
          if (actual !== expected) process.exit(1);
          NODE

  deploy:
    name: Publish WebGL phase two foundation
    needs: [fast-tests, canonical-perft]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified checkpoint
        shell: bash
        run: |
          cat .payload/crownforge.part* | base64 --decode > crownforge-checkpoint.zip
          echo "1bc617418feb0da5860fbb789265df2e496b3e95fea0474af0fcf3896dbbf770  crownforge-checkpoint.zip" | sha256sum --check
          unzip -q crownforge-checkpoint.zip

      - name: Build WebGL geometry-locked deployment package
        shell: bash
        run: |
          rm -rf site
          cp -R CrownforgeChess_WebCheckpoint1/dist site
          cp index.html styles.css last-move.css turn-guidance.css premium-phase1.css webgl-phase2.css board-geometry-lock.css manifest.webmanifest service-worker.js site/
          mkdir -p site/src site/public
          cp src/app-stable.js src/feedback.js src/board3d.js src/board3d-meshes.js site/src/
          cp CrownforgeChess_WebCheckpoint1/dist/src/engine.js site/src/engine-stable.js
          cp -R public/. site/public/

          node --check site/src/app-stable.js
          node --check site/src/engine-stable.js
          node --check site/src/feedback.js
          node --check site/src/board3d.js
          node --check site/src/board3d-meshes.js
          node --check site/service-worker.js
          grep -q '<canvas id="board-3d"' site/index.html
          grep -q 'src/board3d.js?v=11' site/index.html
          grep -q 'webgl-phase2.css?v=11' site/index.html
          grep -q 'board-geometry-lock.css?v=11' site/index.html
          grep -q 'dataset.orientation = "white"' site/src/app-stable.js
          grep -q 'dataset.geometryLocked = "true"' site/src/app-stable.js
          grep -q 'pointer-events: none' site/webgl-phase2.css

          if grep -q 'DecompressionStream' site/src/engine-stable.js; then
            echo "Compressed browser engine loader reached deployment package."
            exit 1
          fi

          if grep -Eq 'ChessGame|game\.play|engine-stable|applyLegalMove|generateLegalMoves' site/src/board3d.js site/src/board3d-meshes.js; then
            echo "WebGL presentation reached into the chess engine."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { ChessGame, Side } from './site/src/engine-stable.js';
          const game = new ChessGame();
          if (game.position.sideToMove !== Side.White) throw new Error('Initial side-to-move is not White.');
          if (game.getLegalMoves().length !== 20) throw new Error('Stable deployed engine did not generate 20 initial legal moves.');
          console.log('Stable deployed engine import and initial legal-move gate passed.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload WebGL playable PWA
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
