<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0908">
  <title>Crownforge Chess</title>
  <link rel="manifest" href="./manifest.webmanifest?v=15">
  <link rel="stylesheet" href="./styles.css?v=15">
  <link rel="stylesheet" href="./last-move.css?v=15">
  <link rel="stylesheet" href="./turn-guidance.css?v=15">
  <link rel="stylesheet" href="./premium-phase1.css?v=15">
  <link rel="stylesheet" href="./webgl-phase2.css?v=15">
  <link rel="stylesheet" href="./cinematic-endgame.css?v=15">
  <link rel="stylesheet" href="./board-geometry-lock.css?v=15">
</head>
<body>
  <main class="app-shell">
    <header>
      <div><p class="eyebrow">CROWNFORGE</p><h1>Play in Person</h1></div>
      <div class="crest">♔</div>
    </header>
    <section class="status-card">
      <strong id="status">Loading verified chessboard…</strong>
      <span id="substatus"></span>
    </section>
    <section class="game-layout">
      <div class="board-stage">
        <canvas id="board-3d" data-ready="false" data-aligned="false" aria-hidden="true"></canvas>
        <div id="board" class="board" aria-label="Fixed square 8 by 8 chessboard with White at the bottom"></div>
      </div>
      <aside>
        <div class="controls">
          <button id="restart">New Game</button>
          <button id="claim-draw" disabled>Claim Draw</button>
        </div>
        <div class="history-panel">
          <h2>Move history</h2>
          <ol id="history"></ol>
        </div>
      </aside>
    </section>
  </main>

  <dialog id="promotion-dialog">
    <h2>Choose promotion</h2>
    <div class="promotion-grid">
      <button data-promotion="5">♕<span>Queen</span></button>
      <button data-promotion="4">♖<span>Rook</span></button>
      <button data-promotion="3">♗<span>Bishop</span></button>
      <button data-promotion="2">♘<span>Knight</span></button>
    </div>
  </dialog>

  <div id="victory" class="victory">
    <div class="victory-beam"></div>
    <div class="victory-card">
      <p>FINAL POSITION CONFIRMED</p>
      <h2 id="victory-title">CHECKMATE</h2>
      <strong id="victory-text">WHITE WINS</strong>
      <button id="rematch">Rematch</button>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js?v=15").catch(() => {});
      });
    }

    window.addEventListener("error", () => {
      const board = document.querySelector("#board");
      const status = document.querySelector("#status");
      if (board && status && board.children.length === 0) {
        status.textContent = "Game update loading — refresh once";
      }
    });

    window.setTimeout(() => {
      const board = document.querySelector("#board");
      const status = document.querySelector("#status");
      if (board && status && board.children.length !== 64) {
        status.textContent = "Game update loading — refresh once";
      }
    }, 5000);
  </script>
  <script src="./src/feedback.js?v=15" defer></script>
  <script type="module" src="./src/board3d.js?v=15"></script>
  <script type="module" src="./src/app-stable.js?v=15"></script>
</body>
</html>
